name: Deploy writing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: writing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout writing source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build writing
        run: |
          npm run check
          node scripts/build.mjs --output dist/site --base-url /writing/

      - name: Verify generated routes
        run: |
          test -f dist/site/experience/amplitude.html
          test -f dist/site/education/university-of-wisconsin-madison.html
          test -f dist/site/resume.html
          grep -q 'location.replace' dist/site/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
